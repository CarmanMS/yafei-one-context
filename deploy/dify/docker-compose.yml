# =============================================================================
# Dify 部署 — Docker Compose (阿里云/腾讯云轻量服务器)
# 用法: docker compose up -d
# =============================================================================
# 参考: https://github.com/langgenius/dify/blob/main/docker/docker-compose.yaml
# 版本: 1.1.3 (2026-06)
# =============================================================================

version: "3.8"

x-shared-env: &shared-env
  LOG_LEVEL: INFO
  TZ: Asia/Shanghai

services:
  # -------- 数据库 --------
  postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *shared-env
      POSTGRES_PASSWORD: dify123
      POSTGRES_USER: dify
      POSTGRES_DB: dify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------- 存储 --------
  weaviate:
    image: semitechnologies/weaviate:1.25.4
    restart: always
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      <<: *shared-env
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1

  # -------- Dify API --------
  api:
    image: langgenius/dify-api:1.1.3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dify-storage:/app/api/storage
    environment:
      <<: *shared-env
      MODE: api
      # 数据库
      DB_USERNAME: dify
      DB_PASSWORD: dify123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_SSL: "false"
      # 向量库
      VECTOR_STORE: weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_PROTOCOL: http
      # 密钥 (首次部署后请修改)
      SECRET_KEY: your-secret-key-change-me-1234567890
      # 存储
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      # 邮件 (可选, 默认禁用注册)
      MAIL_TYPE: ""
      INIT_PASSWORD: admin123
    ports:
      - "5001:5001"

  # -------- Dify Worker --------
  worker:
    image: langgenius/dify-api:1.1.3
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dify-storage:/app/api/storage
    environment:
      <<: *shared-env
      MODE: worker
      DB_USERNAME: dify
      DB_PASSWORD: dify123
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_SSL: "false"
      VECTOR_STORE: weaviate
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_PROTOCOL: http
      SECRET_KEY: your-secret-key-change-me-1234567890
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      MAIL_TYPE: ""

  # -------- Dify Web (前端) --------
  web:
    image: langgenius/dify-web:1.1.3
    restart: always
    environment:
      <<: *shared-env
      CONSOLE_API_URL: ""
      APP_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - api

  # -------- Nginx (对外端口 80) --------
  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/dify.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    environment:
      <<: *shared-env

volumes:
  postgres-data:
  redis-data:
  weaviate-data:
  dify-storage:
