# Shared tool-neutral behavior profiles.

version: 1

profiles:
  - id: default-coding
    name: Default Coding
    description: 面向日常实现的最小、可验证编辑策略。
    mode: edit
    behavior:
      plan_first: false
      test_expectation: targeted
      safety_level: standard
      change_scope: focused
    context_policy:
      load:
        - repo-readme
        - manifest-files
        - local-docs
      prefer:
        - canonical-rules
        - existing-project-conventions
    output_style:
      tone: minimal
      include_verification: true

  - id: research-review
    name: Mathematics Research Review
    description: 面向数学科研、架构与知识治理的保守评审策略。
    mode: review
    behavior:
      plan_first: true
      test_expectation: advisory
      safety_level: conservative
      change_scope: broad
    context_policy:
      load:
        - repo-readme
        - manifest-files
        - local-docs
      prefer:
        - primary-sources
        - explicit-assumptions
        - reproducible-evidence
    output_style:
      tone: structured
      include_verification: true
