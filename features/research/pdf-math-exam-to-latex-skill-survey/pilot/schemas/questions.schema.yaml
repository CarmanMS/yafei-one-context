# 题目卷结构（MVP）— 供 jsonschema 或人工对照
meta:
  title: string
  course_id: string
  academic_year: string
  total_points: number

sections:
  type: array
  items:
    id: string
    title: string          # 如 "一、选择题"
    instruction: string
    questions:
      type: array
      items:
        id: string
        points: number
        stem: string       # LaTeX 内联 $...$
        choices:
          A: string
          B: string
          C: string
          D: string
        answer: string     # 可选
        figure: string|null # 相对 pilot/ 的路径
