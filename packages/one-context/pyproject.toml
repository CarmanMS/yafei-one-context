[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-context"
version = "0.1.0"
description = "Research-oriented multi-repository context control plane, focused on mathematical research"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CarmanMS"}]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["research", "mathematics", "workspace", "context", "cli"]
dependencies = [
  "PyYAML>=6.0.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/CarmanMS/yafei-one-context"
Repository = "https://github.com/CarmanMS/yafei-one-context"
Issues = "https://github.com/CarmanMS/yafei-one-context/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
onecxt = "one_context.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["one_context*"]
