name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: python -m pip install -e "./packages/one-context[dev]"

      - name: Verify wheel build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pip wheel ./packages/one-context --no-deps --wheel-dir wheelhouse

      - name: Validate manifests
        run: python -m one_context doctor

      - name: Run tests
        working-directory: packages/one-context
        run: python -m pytest
